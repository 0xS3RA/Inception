services:
  mariadb:
    image: mariadb
    container_name: mariadb
    build: ./requirements/mariadb
    env_file: .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
      - redis
    env_file: .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  nginx:
    image: nginx
    container_name: nginx
    build: ./requirements/nginx
    depends_on:
      - wordpress
    env_file: .env
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: always

  redis:
    image: redis
    container_name: redis
    build: ./requirements/redis
    volumes:
      - redis_data:/data
    networks:
      - inception
    restart: always

  ftp:
    image: ftp
    container_name: ftp
    build: ./requirements/ftp
    env_file: .env
    environment:
      - FTP_USER=${FTP_USER}
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100:21100"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  static:
    image: static
    container_name: static
    build: ./requirements/static
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: always

  adminer:
    image: adminer
    container_name: adminer
    build: ./requirements/adminer
    depends_on:
      - mariadb
    ports:
      - "8081:8080"
    networks:
      - inception
    restart: always

  mailpit:
    image: mailpit
    container_name: mailpit
    build: ./requirements/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - inception
    restart: always

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vvan-ach/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vvan-ach/data/wordpress
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/vvan-ach/data/redis

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
